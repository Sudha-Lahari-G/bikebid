[project]
name = "bikebid-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S311", "B008", "UP040", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
"migrations/*" = ["E501"]
"app/seed.py" = ["S105"]
# Not secrets: the insecure-default sentinel that production refuses, and an OAuth token type name.
"app/core/config.py" = ["S105"]
"app/schemas.py" = ["S105"]
